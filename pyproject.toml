[project]
name = "tokphd"
version = "0.1.0"
description = "From-scratch BPE tokenization research: verify Karpathy claims on live data"
requires-python = ">=3.10"
dependencies = ["regex", "tiktoken", "matplotlib", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
